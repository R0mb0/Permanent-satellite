# This workflow builds the FPDF Windows Forms application (.NET Framework 4.7.2,
# packages.config-based) using MSBuild on a Windows runner.
#
# FPDF is a classic .NET Framework project, not a .NET (Core) SDK-style project:
# there is no "dotnet test" step (no test project exists) and no Windows
# Application Packaging project (.wapproj), so signing/packaging/artifact-upload
# steps have been removed. This workflow's only job is to prove the solution
# compiles, which is what the README badge reports.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions

name: Compilation_Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Path: PermanentSatellite\PermanentSatellite.sln   # Path to the .sln relative to the repo root.

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Add MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Add nuget.exe to the PATH: https://github.com/NuGet/setup-nuget
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    # Restore packages.config-based NuGet packages referenced by the solution
    - name: Restore NuGet packages
      run: nuget restore $env:Solution_Path

    # Build the solution to prove it compiles
    - name: Build
      run: msbuild $env:Solution_Path /p:Configuration=$env:Configuration /p:Platform="Any CPU"
      env:
        Configuration: ${{ matrix.configuration }}
